name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Verifying Java installation..."
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected version string: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Could not detect Java version"
            exit 1
          fi
          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]] || [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version must be 17 or newer. Found: $MAJOR_VERSION"
            exit 1
          fi
          echo "Java 17+ environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create or verify ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Verifying expected APK at: $EXPECTED_APK"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Searching discovered APKs inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Found APK at $EXPECTED_APK but it is empty"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have .apk extension"
              exit 1
              ;;
          esac

          echo "APK successfully verified at $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "$TEMP_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/^-*//' -e 's/-*$//')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared release asset: $ASSET_PATH ($ASSET_FILENAME)"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset $ASSET_PATH is invalid or missing"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset does not have .apk extension"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### RECIPEPOCKET Debug Build #$GITHUB_RUN_NUMBER

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number**: $GITHUB_RUN_NUMBER
          - **Workflow Run Attempt**: $GITHUB_RUN_ATTEMPT
          - **Source Commit SHA**: $GITHUB_SHA
          - **Release Tag**: $RELEASE_TAG
          - **File Name**: $ASSET_NAME

          > **Notice**: This APK is intended for testing and development preview. It is not a Play Store production release and was signed with a temporary debug keystore.
          EOF
          )

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH#$ASSET_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================================="
            echo "GitHub Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Asset Filename: $ASSET_NAME"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG")
            echo "Release URL: $RELEASE_URL"
            echo "=========================================================="

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "The debug APK was built and published to GitHub Releases:"
              echo "- **Direct Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Downloadable APK Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the release on your Android device."
              echo ""
              echo "> **Backup**: The standard GitHub Actions artifact named \`app-debug-apk\` is also available under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The APK was successfully compiled and preserved in the GitHub Actions artifact."
            echo "Artifact Name: app-debug-apk"

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Warning)"
              echo ""
              echo "The debug APK built successfully, but GitHub Release creation encountered an issue (e.g. repository release permissions or network restriction)."
              echo ""
              echo "- **Backup Download Available**: The debug APK is safely preserved as a workflow artifact named **\`app-debug-apk\`**."
              echo "- You can download it directly from this workflow run's Summary page under the **Artifacts** section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
